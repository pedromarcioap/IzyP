<!DOCTYPE html>
<html>
<head>
    <title>Claude com Puter.js</title>
    <!-- Inclui a biblioteca Puter.js conforme instruído no arquivo HTML -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body {
            width: 350px; /* Largura ajustada para um popup típico */
            padding: 15px;
            font-family: 'Roboto', sans-serif; /* Usando uma fonte comum */
            font-size: 14px;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Inclui padding e borda na largura total */
            resize: vertical; /* Permite redimensionar verticalmente */
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff; /* Cor de botão Bootstrap */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #response {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #eee;
            background-color: #f9f9f9;
            border-radius: 4px;
            min-height: 80px;
            white-space: pre-wrap; /* Preserva quebras de linha e espaços */
            max-height: 300px; /* Limita a altura e adiciona scroll se necessário */
            overflow-y: auto;
        }
        .loading::before {
            content: 'Gerando...';
            font-style: italic;
            color: #777;
        }
    </style>
</head>
<body>
    <h2>Pergunte ao Claude</h2>
    <textarea id="promptInput" placeholder="Digite seu prompt aqui..." rows="4"></textarea>
    <button id="generateButton">Gerar Resposta (Claude 3.7 Sonnet)</button>
    <div id="response"></div>

    <!-- Inclui o script com a lógica da extensão -->
    <script src="popup.js"></script>
</body>
</html>
